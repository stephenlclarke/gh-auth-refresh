[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gh-auth-refresh"
version = "0.1.0"
description = "Headlessly refresh GitHub App installation tokens for GitHub CLI and Git"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Stephen Clarke" }]
keywords = ["github", "github-app", "authentication", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: System :: Systems Administration",
]
dependencies = ["PyJWT[crypto]>=2.10,<3"]

[project.scripts]
gh-auth-refresh = "gh_auth_refresh.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
